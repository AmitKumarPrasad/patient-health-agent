name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the newest run for each branch/PR uses runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install . "pytest>=8.4,<9" "ruff>=0.12,<1"
      - name: Ruff
        working-directory: apps/api
        run: ruff check .
      - name: Pytest
        working-directory: apps/api
        run: pytest -q

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MCP and API dependencies
        run: pip install ./apps/api ./apps/mcp-server "pytest>=8.4,<9" "ruff>=0.12,<1"
      - name: Ruff
        working-directory: apps/mcp-server
        run: ruff check test_server_contract.py
      - name: Pytest
        working-directory: apps/mcp-server
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build web app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: patient-health
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: patient-health-web
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup scripts
        run: |
          bash -n ops/backup/backup_postgres.sh
          bash -n ops/backup/restore_postgres.sh
          bash -n ops/backup/backup_minio.sh
          bash -n ops/backup/verify_restore.sh
      - name: Verify backup documentation
        run: |
          test -s ops/backup/README.md
          grep -qi "Point-in-time recovery" ops/backup/README.md
          grep -q "SHA-256" ops/backup/README.md
          grep -q "RPO" ops/backup/README.md
          grep -q "RTO" ops/backup/README.md

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start E2E backend services
        timeout-minutes: 10
        run: docker compose up -d --build postgres keycloak mailpit minio api
      - name: Wait for API readiness
        run: curl --fail --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8000/ready
      - name: Wait for Keycloak readiness
        run: curl --fail --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:9002/health/ready
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build web app for E2E
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: patient-health
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: patient-health-web
        run: npm run build
      - name: Start web app for E2E
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: patient-health
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: patient-health-web
        run: |
          nohup npm start > /tmp/patient-health-web.log 2>&1 &
          echo $! > /tmp/patient-health-web.pid
      - name: Wait for web application
        run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3000/
      - name: Remove flaky Google Chrome APT source
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        timeout-minutes: 8
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=200 api keycloak postgres
          cat /tmp/patient-health-web.log || true
      - name: Stop E2E services
        if: always()
        run: |
          if [ -f /tmp/patient-health-web.pid ]; then kill "$(cat /tmp/patient-health-web.pid)" || true; fi
          docker compose down -v
