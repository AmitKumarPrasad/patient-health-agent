name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install . "pytest>=8.4,<9" "ruff>=0.12,<1"
      - name: Ruff
        working-directory: apps/api
        run: ruff check .
      - name: Pytest
        working-directory: apps/api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build web app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: patient-health
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: patient-health-web
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Start E2E dependencies
        run: docker compose up -d --build postgres keycloak mailpit minio api
      - name: Wait for API readiness
        run: curl --fail --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8000/ready
      - name: Start E2E web service
        run: docker compose up -d --build web
      - name: Wait for web application
        run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:3000/
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx --yes playwright@1.55.0 test
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 api web keycloak postgres
      - name: Stop E2E services
        if: always()
        run: docker compose down -v
