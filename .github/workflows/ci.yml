name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install . "pytest>=8.4,<9" "ruff>=0.12,<1"
      - name: Ruff
        working-directory: apps/api
        run: ruff check .
      - name: Pytest
        working-directory: apps/api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Build web app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: patient-health
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: patient-health-web
        run: npm run build
