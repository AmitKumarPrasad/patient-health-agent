name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install . "pytest>=8.4,<9" "ruff>=0.12,<1"
      - name: Ruff
        working-directory: apps/api
        run: ruff check .
      - name: Pytest
        working-directory: apps/api
        run: pytest -q

  repair-web-lockfile:
    if: github.event_name == 'push' && github.sha == '44d20432c185770c26baebfef51656735811a77e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Regenerate frontend lockfile metadata
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit normalized lockfile when needed
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Frontend lockfile is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "Step 57: normalize frontend lockfile"
          git push

  web:
    needs: repair-web-lockfile
    if: always() && (needs.repair-web-lockfile.result == 'success' || needs.repair-web-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build web app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: patient-health
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: patient-health-web
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
