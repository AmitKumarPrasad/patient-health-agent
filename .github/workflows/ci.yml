name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install . "pytest>=8.4,<9" "ruff>=0.12,<1"
      - name: Ruff
        working-directory: apps/api
        run: ruff check .
      - name: Pytest
        working-directory: apps/api
        run: pytest -q

  normalize-playwright-lockfile:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'normalize Playwright lockfile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Update frontend lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Frontend lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "Step 58: normalize Playwright lockfile"
          git push

  web:
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, 'declare Playwright E2E dependency') && !contains(github.event.head_commit.message, 'normalize Playwright lockfile') && !contains(github.event.head_commit.message, 'refresh Playwright dependency lockfile'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build web app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: patient-health
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: patient-health-web
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  e2e:
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, 'declare Playwright E2E dependency') && !contains(github.event.head_commit.message, 'normalize Playwright lockfile') && !contains(github.event.head_commit.message, 'refresh Playwright dependency lockfile'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Start E2E dependencies
        run: docker compose up -d --build postgres keycloak mailpit minio api
      - name: Wait for API readiness
        run: curl --fail --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8000/ready
      - name: Start E2E web service
        run: docker compose up -d --build web
      - name: Wait for web application
        run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:3000/
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 api web keycloak postgres
      - name: Stop E2E services
        if: always()
        run: docker compose down -v
