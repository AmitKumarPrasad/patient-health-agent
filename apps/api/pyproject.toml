[build-system]
requires = ["setuptools>=78,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-health-agent-api"
version = "0.1.0"
description = "FastAPI backend for Patient Health Agent"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.10,<3.0",
    "python-jose[cryptography]>=3.5,<4.0",
    "httpx>=0.28,<1.0",
    "langgraph>=1.2,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-tavily>=0.2,<1.0",
    "langchain-core>=1.0,<2.0",
    "minio>=7.2,<8.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "I001"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
