stages:
  - api
  - mcp
  - web
  - validate
  - e2e

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

api:
  stage: api
  image: python:3.13-slim
  script:
    - cd apps/api
    - pip install . "pytest>=8.4,<9" "ruff>=0.12,<1"
    - ruff check .
    - pytest -q

mcp:
  stage: mcp
  image: python:3.13-slim
  script:
    - pip install ./apps/api ./apps/mcp-server "pytest>=8.4,<9" "ruff>=0.12,<1"
    - cd apps/mcp-server
    - ruff check test_server_contract.py
    - pytest -q

web:
  stage: web
  image: node:22-bookworm-slim
  variables:
    NEXT_PUBLIC_API_URL: "http://localhost:8000"
    NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8080"
    NEXT_PUBLIC_KEYCLOAK_REALM: "patient-health"
    NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "patient-health-web"
  script:
    - cd apps/web
    - npm ci
    - npm run build

compose:
  stage: validate
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker compose config --quiet

backup:
  stage: validate
  image: bash:5.2
  script:
    - bash -n ops/backup/backup_postgres.sh
    - bash -n ops/backup/restore_postgres.sh
    - bash -n ops/backup/backup_minio.sh
    - bash -n ops/backup/verify_restore.sh
    - test -s ops/backup/README.md
    - grep -qi "Point-in-time recovery" ops/backup/README.md
    - grep -q "SHA-256" ops/backup/README.md
    - grep -q "RPO" ops/backup/README.md
    - grep -q "RTO" ops/backup/README.md

e2e:
  stage: e2e
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    NEXT_PUBLIC_API_URL: "http://localhost:8000"
    NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8080"
    NEXT_PUBLIC_KEYCLOAK_REALM: "patient-health"
    NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "patient-health-web"
  before_script:
    - apk add --no-cache bash curl nodejs npm
  script:
    - docker compose up -d --build postgres keycloak mailpit minio api
    - curl --fail --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8000/ready
    - curl --fail --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:9002/health/ready
    - cd apps/web
    - npm ci
    - npm run build
    - npx playwright install --with-deps chromium
    - nohup npm start > /tmp/patient-health-web.log 2>&1 &
    - curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3000/
    - E2E_BASE_URL=http://localhost:3000 npx playwright test
  after_script:
    - docker compose logs --no-color --tail=200 api keycloak postgres || true
    - docker compose down -v || true
